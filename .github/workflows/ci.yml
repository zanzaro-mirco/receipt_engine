name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests with coverage
        run: dart test --coverage=coverage

      - name: Format coverage
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  # Il punteggio di pub.dev non è un controllo fatto una volta a mano: è la
  # metrica su cui il pacchetto viene giudicato da chiunque lo apra, e come
  # tutte le metriche che contano va misurata a ogni push.
  #
  # `pana` non gira su Windows — il suo sandbox rifiuta i percorsi con i due
  # punti dei dischi — quindi la macchina di chi sviluppa non può dare questo
  # riscontro. La pipeline sì, ed è l'unico posto dove il numero è riproducibile.
  punteggio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      # Soglia: al massimo 30 punti persi su 160, cioè mai sotto 130. È il
      # criterio dichiarato nella roadmap, scritto dove può fallire invece che
      # in un documento.
      - name: Punteggio pub.dev
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 30 .
